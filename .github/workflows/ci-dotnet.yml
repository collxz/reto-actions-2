
name: CI/CD .NET a Docker

on:
    push:
        branches: [ main ]

jobs:
    construir-y-publicar:
        runs-on: ubuntu-latest

        # Otorgamos permiso al robot para escribir en el almacen de paquetes
        permissions:
            packages: write
            contents: read

        steps:
            - name: 1. Descargar el código
              uses: actions/checkout@v4

            - name: 2. Iniciar sesion en GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN}}

            - name: 3. Constuir y subir imagen de Docker
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: ghcr.io/${{ github.repository }}/api-pagos:latest