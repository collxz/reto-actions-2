

name: CI .NET LV

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

jobs:
    compilar-codigo:
        runs-on: ubuntu-latest

        steps:
            - name: 1. Descargar el código del repositorio
              uses: actions/checkout@v4
            
            - name: 2. Configurar el entorno de .NET 8
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '8.0.x'

            - name: 3. Restaurar las dependencias del proyecto
              run: dotnet restore

            - name: 4. Compilar el proyecto
              run: dotnet build --no-restore

            - name: 5. Prueba de inyección de credenciales
              env:
                MI_AMBIENTE: ${{ vars.ENTORNO_DESPLIEGUE }}
                MI_PASSWORD: ${{ secrets.PASSWORD_DB_PROD }}
              run: |
                echo "Ejecutando pipeline en el entorno: $MI_AMBIENTE"
                echo "La contraseña inyectada es: $MI_PASSWORD"